
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickMath 2.1</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #eef4ff;
  color: #172554;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: white;
  width: 100%;
  max-width: 440px;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  text-align: center;
}

h1 {
  margin-bottom: 5px;
  color: #2563eb;
}

.subtitle {
  color: #64748b;
  margin-top: 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 22px 0;
}

.stat {
  background: #eff6ff;
  padding: 12px 5px;
  border-radius: 12px;
}

.stat strong {
  display: block;
  font-size: 22px;
  color: #2563eb;
}

.stat span {
  font-size: 12px;
  color: #64748b;
}

label {
  display: block;
  text-align: left;
  margin-bottom: 7px;
  font-weight: bold;
}

select, input, button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  font-size: 16px;
}

select, input {
  border: 1px solid #cbd5e1;
  margin-bottom: 16px;
  background: white;
}

.question {
  font-size: 34px;
  font-weight: bold;
  margin: 25px 0;
  color: #1e40af;
}

button {
  border: none;
  cursor: pointer;
  font-weight: bold;
  margin-top: 5px;
}

.primary {
  background: #2563eb;
  color: white;
}

.secondary {
  background: #e2e8f0;
  color: #1e293b;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.feedback {
  min-height: 28px;
  margin: 15px 0;
  font-weight: bold;
}

.correct {
  color: #15803d;
}

.wrong {
  color: #dc2626;
}

.footer {
  margin-top: 22px;
  color: #94a3b8;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">
  <h1>QuickMath 2.1</h1>
  <p class="subtitle">Think fast. Learn faster.</p>

  <div class="stats">
    <div class="stat">
      <strong id="score">0</strong>
      <span>Score</span>
    </div>
    <div class="stat">
      <strong id="streak">0</strong>
      <span>Streak</span>
    </div>
    <div class="stat">
      <strong id="accuracy">0%</strong>
      <span>Accuracy</span>
    </div>
  </div>

  <label for="difficulty">Choose difficulty</label>
  <select id="difficulty">
    <option value="10">Easy (1–10)</option>
    <option value="50">Medium (1–50)</option>
    <option value="100">Hard (1–100)</option>
  </select>

  <label for="operation">Choose operation</label>
  <select id="operation">
    <option value="random">Mixed operations</option>
    <option value="+">Addition (+)</option>
    <option value="-">Subtraction (−)</option>
    <option value="*">Multiplication (×)</option>
    <option value="/">Division (÷)</option>
  </select>

  <div class="question" id="question">5 + 3 = ?</div>

  <input
    type="number"
    id="answer"
    placeholder="Enter your answer"
    inputmode="numeric"
  >

  <button class="primary" id="checkBtn">Check Answer</button>
  <div class="feedback" id="feedback" aria-live="polite"></div>

  <button class="secondary" id="nextBtn">Next Question</button>

  <p class="footer">QuickMath 2.1 | Built for curious minds</p>
</div>

<script>
let score = 0;
let streak = 0;
let attempted = 0;
let correct = 0;
let correctAnswer = 0;
let answered = false;

const questionEl = document.getElementById("question");
const answerEl = document.getElementById("answer");
const feedbackEl = document.getElementById("feedback");
const scoreEl = document.getElementById("score");
const streakEl = document.getElementById("streak");
const accuracyEl = document.getElementById("accuracy");
const difficultyEl = document.getElementById("difficulty");
const operationEl = document.getElementById("operation");
const checkBtn = document.getElementById("checkBtn");

function randomNumber(max) {
  return Math.floor(Math.random() * max) + 1;
}

function generateQuestion() {
  const max = Number(difficultyEl.value);
  let operation = operationEl.value;

  if (operation === "random") {
    const operations = ["+", "-", "*", "/"];
    operation = operations[Math.floor(Math.random() * 4)];
  }

  let a, b;

  if (operation === "/") {
    b = randomNumber(max);
    const quotient = randomNumber(max);
    a = b * quotient;
    correctAnswer = quotient;
  } else {
    a = randomNumber(max);
    b = randomNumber(max);

    if (operation === "-") {
      if (b > a) [a, b] = [b, a];
      correctAnswer = a - b;
    }

    if (operation === "+") correctAnswer = a + b;
    if (operation === "*") correctAnswer = a * b;
  }

  const symbols = {
    "+": "+",
    "-": "−",
    "*": "×",
    "/": "÷"
  };

  questionEl.textContent =
    `${a} ${symbols[operation]} ${b} = ?`;

  answerEl.value = "";
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  answered = false;
  checkBtn.disabled = false;
  answerEl.disabled = false;
  answerEl.focus();
}

function updateStats() {
  scoreEl.textContent = score;
  streakEl.textContent = streak;

  const percentage = attempted === 0
    ? 0
    : Math.round((correct / attempted) * 100);

  accuracyEl.textContent = percentage + "%";
}

function checkAnswer() {
  if (answered) return;

  const userAnswer = answerEl.value.trim();

  if (userAnswer === "") {
    feedbackEl.textContent = "Please enter an answer first.";
    feedbackEl.className = "feedback wrong";
    return;
  }

  attempted++;
  answered = true;
  checkBtn.disabled = true;
  answerEl.disabled = true;

  if (Number(userAnswer) === correctAnswer) {
    score++;
    correct++;
    streak++;

    feedbackEl.textContent = "Correct! Excellent work!";
    feedbackEl.className = "feedback correct";
  } else {
    streak = 0;

    feedbackEl.textContent =
      `Not quite! The correct answer is ${correctAnswer}.`;

    feedbackEl.className = "feedback wrong";
  }

  updateStats();
}

checkBtn.addEventListener("click", checkAnswer);

document.getElementById("nextBtn").addEventListener(
  "click",
  generateQuestion
);

answerEl.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    checkAnswer();
  }
});

difficultyEl.addEventListener("change", generateQuestion);
operationEl.addEventListener("change", generateQuestion);

generateQuestion();
</script>

</body>
</html>
